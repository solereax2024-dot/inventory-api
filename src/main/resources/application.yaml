spring:
  application:
    name: sole-reax-inventory-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sole_reax}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
  paymongo:
    enabled: ${PAYMONGO_ENABLED:false}
    api-base-url: ${PAYMONGO_API_BASE_URL:https://api.paymongo.com/v1}
    secret-key: ${PAYMONGO_SECRET_KEY:}
    webhook-token: ${PAYMONGO_WEBHOOK_TOKEN:}
    webhook-signing-secret: ${PAYMONGO_WEBHOOK_SIGNING_SECRET:}
    webhook-tolerance-seconds: ${PAYMONGO_WEBHOOK_TOLERANCE_SECONDS:300}
    checkout-success-url: ${PAYMONGO_CHECKOUT_SUCCESS_URL:https://solereax.com/collections?payment=success}
    checkout-cancel-url: ${PAYMONGO_CHECKOUT_CANCEL_URL:https://solereax.com/collections?payment=cancel}
    payment-method-types: ${PAYMONGO_PAYMENT_METHOD_TYPES:gcash,paymaya,card}

server:
  port: 8080
